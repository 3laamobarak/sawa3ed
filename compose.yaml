# Local development only. For production, configure TLS, secrets, private storage and SMTP.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost;127.0.0.1
      Database__Provider: SqlServer
      ConnectionStrings__Default: Server=sqlserver;Database=Sawa3ed;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__OtpPepper: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      Email__UseDevelopmentPickup: "true"
    ports: ["127.0.0.1:5080:8080"]
    volumes: ["app-data:/app/App_Data"]
    depends_on:
      sqlserver:
        condition: service_healthy
volumes:
  sql-data:
  app-data:
